<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aha Lab · Learn hard ideas by playing with them</title>
<meta name="description" content="Interactive visualizations that teach one hard idea at a time — Catan strategy, the Theory of Constraints, Newton's gravity, thermodynamics, and quantum mechanics.">
<link rel="stylesheet" href="assets/site.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">

<div id="site-nav"></div>

<header class="hero">
  <h1>Aha <span>Lab</span></h1>
</header>

<main>
  <div class="searchwrap">
    <div class="searchbox"><span class="si">🔍</span><input id="search" class="search" type="search" autocomplete="off" placeholder="Search topics…"></div>
  </div>
  <div class="topics" id="topics"></div>
</main>

<footer class="site-foot">
  <div class="stats-strip">
    <div class="stat"><b id="stat-visits">—</b><span>total visits</span></div>
    <div class="stat"><b id="stat-top">—</b><span>most explored</span></div>
    <div class="stat"><b id="stat-count">4</b><span>topics</span></div>
  </div>
  <p>Built with plain HTML — no frameworks. Each topic is one self-contained page.
     More topics coming soon.</p>
</footer>

<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script>
  // Build the topic grid from config, with live search.
  (function () {
    var base = location.pathname.replace(/[^\/]*$/, "");   // dir the site is served from (for GoatCounter paths)
    var grid = document.getElementById("topics");
    function esc(s) { return s.replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }
    function card(t) {
      return '<a class="topic" href="' + t.path + '">' +
        '<span class="emoji">' + t.emoji + '</span>' +
        '<h3>' + t.title + '</h3>' +
        '<p>' + t.blurb + '</p>' +
      '</a>';
    }
    function renderGrid(q) {
      q = (q || "").trim().toLowerCase();
      var list = SITE.topics.filter(function (t) {
        return !q || (t.title + " " + t.blurb + " " + (t.group || "")).toLowerCase().indexOf(q) >= 0;
      });
      // sections follow the nav order: first appearance of each group in config
      var groups = [], byGroup = {};
      list.forEach(function (t) {
        var g = t.group || "Other";
        if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
        byGroup[g].push(t);
      });
      grid.innerHTML = list.length ? groups.map(function (g) {
        var n = byGroup[g].length;
        return '<section class="group-sec"><div class="group-head"><h2>' + g + '</h2><span class="count">' +
          n + (n === 1 ? " topic" : " topics") + '</span></div><div class="group-grid">' +
          byGroup[g].map(card).join("") + '</div></section>';
      }).join("")
        : '<p class="noresults">No topics match "<b>' + esc(q) + '</b>". Try another word — e.g. quantum, entropy, or AI.</p>';
    }
    document.getElementById("search").placeholder = "Search " + SITE.topics.length + " topics…  (e.g. quantum, entropy, AI)";
    document.getElementById("search").addEventListener("input", function () { renderGrid(this.value); });
    renderGrid("");
    document.getElementById("stat-count").textContent = SITE.topics.length;

    // Engagement strip: total visits + most-explored topic (best effort; needs public counters).
    if (window.LAB) {
      LAB.renderCounts();
      LAB.fetchCount("TOTAL")
        .then(function (n) { document.getElementById("stat-visits").textContent = n; })
        .catch(function () {});
      Promise.all(SITE.topics.map(function (t) {
        var p = base + t.path;
        return LAB.fetchCount(p)
          .then(function (n) { return { title: t.title, n: parseInt(String(n).replace(/[^0-9]/g, ""), 10) || 0 }; })
          .catch(function () { return { title: t.title, n: 0 }; });
      })).then(function (rows) {
        var best = rows.sort(function (a, b) { return b.n - a.n; })[0];
        if (best && best.n > 0) document.getElementById("stat-top").textContent = best.title;
      });
    }
  })();
</script>
